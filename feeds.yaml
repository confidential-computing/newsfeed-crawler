# Each feed may carry:
#   region: where the outlet is based, not what the story is about
#           (lower-case code: us, uk, global, asia, in, sg, kr, jp, tw, hk,
#           cn, my, ...). Not shown in reports; recorded in the subjects JSON
#           and used by --exclude-region and --only-region. A domain in an
#           optional top-level `outlet_regions:` mapping (domain: region),
#           crawler.py's OUTLET_REGIONS, or a country-code TLD takes
#           precedence. For Google News feeds the region is taken per article
#           from the publishing outlet instead.
#   timezone: IANA zone (e.g. Asia/Seoul) for feeds whose dates carry no
#           zone of their own. Without it such dates are read as UTC.
#           Dates that do state a zone are left alone.
#   lang:   language of the feed's articles (es, pt, ...; default en). Its
#           articles are matched against the English keywords plus the
#           language's list under `keywords:` below, and their titles are
#           shown in English with the original after them.
#
# Keywords per language, added to the English ones (--keywords) for feeds with
# that `lang:`. Acronyms (TEE, SGX, TDX, SEV) need no translation. In Spanish
# and Portuguese bare "enclave" is an ordinary word, so only qualified forms
# count there.
keywords:
  es:
    - computación confidencial
    - informática confidencial
    - IA confidencial
    - inteligencia artificial confidencial
    - entorno de ejecución confiable
    - entornos de ejecución confiables
    - entorno de ejecución de confianza
    - entornos de ejecución de confianza
    - entorno de ejecución seguro
    - atestación remota
    - máquina virtual confidencial
    - máquinas virtuales confidenciales
    - contenedores confidenciales
    - enclave seguro
    - enclaves seguros
    - enclave de seguridad
    - enclave SGX
    - enclaves SGX
    - Secure Enclave
  pt:
    - computação confidencial
    - IA confidencial
    - inteligência artificial confidencial
    - ambiente de execução confiável
    - ambientes de execução confiáveis
    - ambiente de execução seguro
    - atestação remota
    - máquina virtual confidencial
    - máquinas virtuais confidenciais
    - contêineres confidenciais
    - containers confidenciais
    - enclave seguro
    - enclaves seguros
    - enclave de segurança
    - enclave SGX
    - enclaves SGX
    - Secure Enclave
# Sites whose article pages are fetched one at a time with a pause between
# requests (`polite_delay:` seconds, default 2) instead of the usual 2 at once.
# Every hostname on the same server (IP address) is slowed too. TechDay (IT
# Brief / SecurityBrief) blocked us on 2026-11-05 after a catch-up run
# fetched too much from them.
